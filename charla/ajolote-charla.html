<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ajolote · Charla</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Baloo+2:wght@600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --agua:#1A7F7A; --agua-2:#0E5E5A; --agua-claro:#CDEDEA; --on-agua:#FFFFFF;
  --rosa:#F49BBE; --rosa-2:#D9578A; --rosa-claro:#FDE4EF;
  --flor:#FFB020; --flor-2:#C77700; --flor-claro:#FFF1CF;
  --jaca:#7B5CD6; --jaca-claro:#ECE6FC;
  --bg:#EEF8F6; --surface:#FFFFFF; --ink:#1C2B3A; --ink-2:#506272; --line:#D2E6E3;
  --mejilla:#FF8FA3;
  --r-xl:30px; --r-lg:20px; --r-md:14px;
  --font-display:'Baloo 2', ui-rounded, 'SF Pro Rounded', system-ui, sans-serif;
  --font-body:'Atkinson Hyperlegible', -apple-system, system-ui, 'Segoe UI', sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --agua:#43BDB4; --agua-2:#1E7F79; --agua-claro:#163E40; --on-agua:#0F1E26;
    --rosa:#F49BBE; --rosa-2:#E27AA6; --rosa-claro:#3B2333;
    --flor:#FFC14D; --flor-2:#FFB020; --flor-claro:#3A2F14;
    --jaca:#A991F0; --jaca-claro:#2E2754;
    --bg:#0F1E26; --surface:#172C36; --ink:#E8F4F2; --ink-2:#A6BFC4; --line:#28454F;
    --mejilla:#F07A92; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --agua:#43BDB4; --agua-2:#1E7F79; --agua-claro:#163E40; --on-agua:#0F1E26;
  --rosa:#F49BBE; --rosa-2:#E27AA6; --rosa-claro:#3B2333;
  --flor:#FFC14D; --flor-2:#FFB020; --flor-claro:#3A2F14;
  --jaca:#A991F0; --jaca-claro:#2E2754;
  --bg:#0F1E26; --surface:#172C36; --ink:#E8F4F2; --ink-2:#A6BFC4; --line:#28454F;
  --mejilla:#F07A92; color-scheme:dark;
}

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%; scroll-padding-top:env(safe-area-inset-top,0px)}
body{
  margin:0; background:var(--bg); color:var(--ink);
  font-family:var(--font-body); font-size:17px; line-height:1.5;
  padding-top:env(safe-area-inset-top,0px);
  -webkit-tap-highlight-color:transparent;
}
button, input, select{font:inherit; color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--flor); outline-offset:2px; border-radius:10px}
.ic{width:24px; height:24px; display:block; flex-shrink:0}

.app{max-width:560px; margin:0 auto; padding:14px 18px calc(104px + env(safe-area-inset-bottom,0px))}
.view{display:none}
.view.active{display:block}

h1,h2,h3{font-family:var(--font-display); line-height:1.1; margin:0}
.title{font-size:2rem; font-weight:800}
.muted{color:var(--ink-2)}
.top{display:flex; align-items:baseline; justify-content:space-between; gap:12px; margin:.4rem 0 1rem}

/* ---------- Botones ---------- */
.btn-go{
  display:block; width:100%; border:0; border-radius:999px;
  background:var(--agua); color:var(--on-agua);
  font-family:var(--font-display); font-weight:800; font-size:1.35rem;
  padding:.8rem 1.4rem .7rem; box-shadow:0 5px 0 var(--agua-2);
  transition:transform .08s, box-shadow .08s;
}
.btn-go:active{transform:translateY(3px); box-shadow:0 2px 0 var(--agua-2)}
.btn-go[disabled]{opacity:.45; box-shadow:none}
.btn-soft{
  border:2px solid var(--line); background:var(--surface); border-radius:999px;
  padding:.55rem 1.05rem; font-weight:700; box-shadow:0 3px 0 var(--line);
}
.btn-soft:active{transform:translateY(2px); box-shadow:0 1px 0 var(--line)}
.btn-text{border:0; background:none; font-weight:700; color:var(--agua); padding:.4rem .2rem}
.btn-text[disabled]{opacity:.35}
.icon-btn{
  width:46px; height:46px; border-radius:16px; border:2px solid var(--line);
  background:var(--surface); display:grid; place-items:center; color:var(--ink);
}
.play{
  width:42px; height:42px; border-radius:50%; border:2px solid var(--line);
  background:var(--surface); display:grid; place-items:center; color:var(--agua); flex-shrink:0;
}
.play .ic{width:16px; height:16px; margin-left:2px}
.play:active{transform:scale(.94)}

/* ---------- Chips ---------- */
.chips{display:flex; gap:8px; overflow-x:auto; padding:2px 2px 6px; margin:0 -2px; scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{
  white-space:nowrap; border:2px solid var(--line); background:var(--surface);
  border-radius:999px; padding:.3rem .85rem; font-weight:700; font-size:.92rem;
}
.chip[aria-pressed="true"]{background:var(--ink); color:var(--bg); border-color:var(--ink)}

.search{
  width:100%; border:2px solid var(--line); background:var(--surface);
  border-radius:var(--r-lg); padding:.7rem 1rem; font-size:1rem; margin-bottom:.8rem;
}
.search::placeholder{color:var(--ink-2)}

/* ---------- Hoy ---------- */
.hoy-head{display:flex; justify-content:space-between; align-items:flex-start; gap:12px; margin-top:.3rem}
.fecha{margin:0 0 .1rem; color:var(--ink-2); font-weight:700}
.greet{font-size:clamp(2.1rem, 9vw, 2.7rem); font-weight:800; letter-spacing:-.01em}
.lede{font-size:1.12rem; margin:.5rem 0 1rem}
.lago{
  background:var(--agua-claro); border-radius:var(--r-xl);
  padding:14px 10px 10px; margin-bottom:1.3rem; overflow:hidden;
}
.lago .ajolote{width:min(270px, 72%); margin:0 auto; display:block}
.lago .ajolote.enter{animation:pop .55s cubic-bezier(.2,1.4,.4,1) both}
@keyframes pop{from{transform:scale(.82) translateY(10px); opacity:0} to{transform:none; opacity:1}}
.canal{width:100%; display:block; margin-top:-16px}
.canal-cap{margin:.2rem .4rem 0; font-weight:700; color:var(--agua-2); font-size:.95rem}
:root[data-theme="dark"] .canal-cap{color:var(--agua)}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) .canal-cap{color:var(--agua)} }
.c-water{fill:var(--agua)}
.c-water2{fill:var(--agua-2); opacity:.35}
.c-boat{transition:transform 1s cubic-bezier(.3,.9,.3,1)}
.b-hull{fill:var(--flor)}
.b-arch{fill:var(--rosa-2)}
.b-p1{fill:var(--flor-claro)} .b-p2{fill:var(--agua-claro)} .b-p3{fill:var(--jaca-claro)}
.b-post{fill:var(--ink-2)}

.racha{display:flex; align-items:center; gap:10px; margin:1.2rem 0 .2rem; font-weight:700}
.flores{display:flex}
.flores svg{width:26px; height:26px; margin-right:-5px}
.frase{
  margin-top:1.3rem; background:var(--surface); border:2px solid var(--line);
  border-radius:var(--r-lg); padding:1rem 1.1rem; display:flex; gap:12px; align-items:center;
}
.frase h2{font-size:1rem; color:var(--ink-2); font-weight:700; margin-bottom:.15rem}
.frase-es{font-family:var(--font-display); font-weight:700; font-size:1.35rem; margin:0; line-height:1.15}
.frase-en{margin:.15rem 0 0; color:var(--ink-2)}
.frase > div{flex:1}

/* ---------- Ajolote ---------- */
.a-gill{fill:var(--rosa-2)}
.a-vein{fill:none; stroke:var(--rosa); stroke-width:2.5; stroke-linecap:round; opacity:.8}
.a-head,.a-body{fill:var(--rosa)}
.a-tail{fill:var(--rosa-2); opacity:.9}
.a-arm{fill:var(--rosa-2)}
.a-shine{fill:#fff; opacity:.3}
.a-spot{fill:var(--rosa-2); opacity:.55}
.a-eye{fill:#1C2B3A}
.a-glint{fill:#fff}
.a-line{fill:none; stroke:#1C2B3A; stroke-width:4; stroke-linecap:round}
.a-cheek{fill:var(--mejilla); opacity:.55}
.a-z{font:800 20px var(--font-display); fill:var(--ink-2)}
.sparkles path{fill:var(--flor)}
.ajolote .eyes, .ajolote .sparkles{display:none}
.ajolote[data-mood="normal"] .eyes-normal,
.ajolote[data-mood="happy"] .eyes-happy,
.ajolote[data-mood="happy"] .sparkles,
.ajolote[data-mood="sleepy"] .eyes-sleepy{display:inline}
.sway-l{transform-box:view-box; transform-origin:0 0; animation:swayL 3.6s ease-in-out infinite alternate}
.sway-r{transform-box:view-box; transform-origin:0 0; animation:swayR 3.6s ease-in-out infinite alternate}
@keyframes swayL{from{transform:translate(66px,92px) rotate(-4deg)} to{transform:translate(66px,92px) rotate(4deg)}}
@keyframes swayR{from{transform:translate(174px,92px) scale(-1,1) rotate(-4deg)} to{transform:translate(174px,92px) scale(-1,1) rotate(4deg)}}
.ajolote[data-mood="happy"] .sparkles path{animation:twinkle .9s ease-out both}
.ajolote[data-mood="happy"] .sparkles path:nth-child(2){animation-delay:.15s}
.ajolote[data-mood="happy"] .sparkles path:nth-child(3){animation-delay:.3s}
@keyframes twinkle{from{opacity:0; transform:scale(.3)} 60%{opacity:1; transform:scale(1.2)} to{transform:scale(1)}}
.sparkles path{transform-box:fill-box; transform-origin:center}

/* ---------- Tarjetas ---------- */
.sess-top{display:flex; align-items:center; justify-content:space-between; gap:8px; margin:.1rem 0 .2rem}
.counts{display:flex; justify-content:center; gap:22px; font-weight:700; margin:0 0 .9rem}
.counts span{display:flex; flex-direction:column; align-items:center; line-height:1.05}
.counts b{font-size:1.05rem}
.counts small{font-size:.68rem; opacity:.85}
.n-new{color:var(--agua)} .n-learn{color:var(--rosa-2)} .n-rev{color:var(--jaca)}
.flash{display:block; width:100%; border:0; padding:0; background:none; perspective:1300px; text-align:center}
.flash-inner{display:block; position:relative; height:min(330px, 46vh); min-height:250px; transition:transform .5s cubic-bezier(.2,.85,.25,1); transform-style:preserve-3d}
.flash.flipped .flash-inner{transform:rotateY(180deg)}
.face{
  position:absolute; inset:0; -webkit-backface-visibility:hidden; backface-visibility:hidden;
  background:var(--surface); border:2px solid var(--line); border-radius:var(--r-xl);
  box-shadow:0 7px 0 var(--line);
  display:flex; flex-direction:column; align-items:center; justify-content:center; gap:.6rem; padding:22px 20px;
}
.face.back{transform:rotateY(180deg); background:var(--rosa-claro); border-color:var(--rosa)}
.flash-cat{font-weight:700; font-size:.85rem; color:var(--ink-2); background:var(--bg); border-radius:999px; padding:.15rem .7rem}
.face.back .flash-cat{background:var(--surface)}
.flash-big{font-family:var(--font-display); font-weight:700; font-size:clamp(1.7rem, 7.5vw, 2.4rem); line-height:1.12; overflow-wrap:anywhere}
.flash-small{color:var(--ink-2); font-size:1.05rem}
.flash-hint{color:var(--ink-2); font-size:.9rem; margin-top:.4rem}
.below{margin-top:1.4rem}
.grades{display:grid; grid-template-columns:repeat(4,1fr); gap:8px}
.grade{
  border:2px solid currentColor; background:var(--surface); border-radius:var(--r-lg);
  padding:.55rem .2rem .45rem; display:flex; flex-direction:column; align-items:center; gap:.1rem;
  font-weight:700; box-shadow:0 4px 0 currentColor;
}
.grade:active{transform:translateY(2px); box-shadow:0 2px 0 currentColor}
.grade span{font-family:var(--font-display); font-size:clamp(.88rem, 3.9vw, 1.05rem); line-height:1.1; white-space:nowrap}
.grade small{font-weight:400; font-size:.78rem; color:var(--ink-2)}
.g1{color:var(--rosa-2)} .g2{color:var(--flor-2)} .g3{color:var(--agua)} .g4{color:var(--jaca)}
.idle h2{font-size:1.25rem; margin:1.6rem 0 .6rem}
.idle .summary{font-size:1.08rem; margin:.4rem 0 1rem}
.practice{display:flex; flex-wrap:wrap; gap:10px}
.done{text-align:center; padding-top:.5rem}
.done .ajolote{width:min(230px,65%); margin:0 auto; display:block}
.done h1{font-size:2.3rem; margin:.4rem 0 .3rem}
.done p{font-size:1.1rem; margin:0 0 1.4rem}
.done .practice{justify-content:center; margin-top:1rem}

.misslist{margin-top:1.8rem; border:2px solid var(--line); border-radius:var(--r-lg); background:var(--surface)}
.misslist summary{cursor:pointer; padding:.85rem 1rem; font-weight:700; list-style:none}
.misslist summary::-webkit-details-marker{display:none}
.misslist summary::before{content:"▸"; display:inline-block; width:1.1em; transition:transform .2s}
.misslist[open] summary::before{transform:rotate(90deg)}
.misslist .rows{padding:0 1rem .6rem}
.miss-n{font-weight:700; border-radius:999px; padding:.05rem .55rem; font-size:.82rem}
.miss-n.hard{background:var(--rosa-claro); color:var(--rosa-2)}
.miss-n.soft{background:var(--bg); color:var(--ink-2)}
.miss-note{font-size:.88rem; color:var(--ink-2); margin:.6rem 0 .2rem}

/* ---------- Listas ---------- */
.group h2{font-size:1.3rem; margin:1.4rem 0 .3rem; display:flex; align-items:center; gap:10px}
.group h2 .muted{font-family:var(--font-body); font-size:.9rem; font-weight:400}
.row{display:flex; align-items:center; gap:12px; padding:.65rem 0; border-bottom:1.5px solid var(--line)}
.row:last-child{border-bottom:0}
.w{flex:1; min-width:0; display:flex; flex-direction:column; text-align:left; border:0; background:none; padding:0}
.w-es{font-weight:700; font-size:1.1rem; display:flex; align-items:center; gap:7px; flex-wrap:wrap}
.w-en{color:var(--ink-2); font-size:.93rem}
.w.link .w-es{color:var(--agua)}
.w.link .w-es::after{content:"conjugar"; font-weight:400; font-size:.75rem; color:var(--ink-2); border:1.5px solid var(--line); border-radius:6px; padding:0 .35rem}
.gp{font-size:.72rem; font-weight:700; border-radius:6px; padding:.02rem .4rem}
.gp-m{background:var(--agua-claro); color:var(--agua-2)}
.gp-f{background:var(--flor-claro); color:var(--flor-2)}
:root[data-theme="dark"] .gp-m{color:var(--agua)}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) .gp-m{color:var(--agua)} }
.dot{width:11px; height:11px; border-radius:50%; background:transparent; border:2px solid var(--line); flex-shrink:0}
.dot.learning{background:var(--rosa); border-color:var(--rosa)}
.dot.review{background:var(--agua); border-color:var(--agua)}
.dot.mature{background:var(--jaca); border-color:var(--jaca)}
.legend{display:flex; flex-wrap:wrap; gap:4px 14px; font-size:.85rem; color:var(--ink-2); margin:.2rem 0 .4rem}
.legend span{display:inline-flex; align-items:center; gap:6px}
.empty{color:var(--ink-2); padding:1rem 0}

/* ---------- Verbos ---------- */
.tags{display:flex; flex-wrap:wrap; gap:5px; margin-top:.2rem}
.tag{font-size:.74rem; font-weight:700; border-radius:7px; padding:.05rem .45rem}
.tag-bota{background:var(--jaca-claro); color:var(--jaca)}
.tag-fuerte{background:var(--flor-claro); color:var(--flor-2)}
.tag-irr{background:var(--rosa-claro); color:var(--rosa-2)}
.tag-yo{background:var(--agua-claro); color:var(--agua-2)}
:root[data-theme="dark"] .tag-yo{color:var(--agua)}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) .tag-yo{color:var(--agua)} }
.hit{
  display:block; width:100%; text-align:left; border:2px solid var(--jaca); background:var(--jaca-claro);
  border-radius:var(--r-md); padding:.65rem .9rem; margin-bottom:.6rem; color:var(--ink);
}
.hit b{color:var(--jaca)}

/* ---------- Hojas ---------- */
dialog.sheet{
  border:0; padding:0; margin:auto auto 0; width:100%; max-width:560px; max-height:92vh;
  border-radius:28px 28px 0 0; background:var(--bg); color:var(--ink); overflow:auto;
}
dialog.sheet::backdrop{background:rgba(15,30,38,.5)}
dialog.sheet[open]{animation:sheetUp .28s cubic-bezier(.2,.9,.3,1)}
@keyframes sheetUp{from{transform:translateY(40px); opacity:.4}}
.sheet-in{padding:10px 18px calc(22px + env(safe-area-inset-bottom,0px))}
.grab{width:44px; height:5px; border-radius:3px; background:var(--line); margin:4px auto 14px}
.sheet-head{display:flex; justify-content:space-between; align-items:flex-start; gap:12px}
.verb-title{font-size:2.3rem; font-weight:800}
.sheet h3{font-size:1.2rem; margin:1.3rem 0 .55rem}
.conj{display:grid; grid-template-columns:1fr 1fr; gap:8px}
.cell{
  text-align:left; background:var(--surface); border:2px solid var(--line); border-radius:var(--r-md);
  padding:.45rem .65rem .5rem; color:var(--ink);
}
.cell small{display:block; color:var(--ink-2); font-size:.76rem}
.cell .f{font-weight:700; font-size:1.08rem; overflow-wrap:anywhere}
.cell.chg{background:var(--jaca-claro); border-color:var(--jaca)}
.cell.vos{opacity:.5}
.refl{color:var(--ink-2); font-weight:400}
mark{background:none; color:inherit}
mark.chg{color:var(--jaca); text-decoration:underline 3px; text-underline-offset:3px}
mark.end{background:var(--flor-claro); color:var(--flor-2); border-radius:4px; padding:0 1px}
.cell.chg mark.end{background:var(--surface)}
.explain{display:flex; gap:10px; align-items:flex-start; margin:.6rem 0 0; font-size:.95rem}
.explain svg{width:30px; height:30px; flex-shrink:0; color:var(--jaca)}
.explain.fuerte svg{color:var(--flor-2)}
.nw{white-space:nowrap}
.note{background:var(--surface); border:2px dashed var(--line); border-radius:var(--r-md); padding:.7rem .9rem; font-size:.93rem; margin:1.2rem 0 0}
.sheet .btn-soft.close{display:block; margin:1.4rem auto 0}

.set{margin:1.2rem 0}
.set > label, .set > .lbl{display:block; font-weight:700; margin-bottom:.45rem}
.seg{display:flex; background:var(--surface); border:2px solid var(--line); border-radius:999px; padding:3px}
.seg button{flex:1; border:0; background:none; border-radius:999px; padding:.42rem .3rem; font-weight:700; font-size:.95rem}
.seg button[aria-pressed="true"]{background:var(--ink); color:var(--bg)}
select{width:100%; border:2px solid var(--line); background:var(--surface); border-radius:var(--r-md); padding:.6rem .8rem}
.sheet a{color:var(--agua); font-weight:700}

/* ---------- Barra inferior ---------- */
.tabbar{
  position:fixed; left:0; right:0; bottom:0; z-index:5;
  background:var(--surface); border-top:2px solid var(--line);
  padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px));
}
.tabbar-in{max-width:560px; margin:0 auto; display:grid; grid-template-columns:repeat(4,1fr); gap:4px}
.tab{
  border:0; background:none; display:flex; flex-direction:column; align-items:center; gap:2px;
  padding:6px 0 4px; font-size:.78rem; font-weight:700; color:var(--ink-2); border-radius:16px;
}
.tab .blob{width:52px; height:32px; border-radius:16px; display:grid; place-items:center; transition:background .2s}
.tab[aria-current="page"]{color:var(--ink)}
.tab[aria-current="page"] .blob{background:var(--rosa-claro); color:var(--rosa-2)}

.toast{
  position:fixed; left:50%; transform:translateX(-50%);
  bottom:calc(86px + env(safe-area-inset-bottom,0px)); z-index:20;
  background:var(--ink); color:var(--bg); border-radius:18px; padding:.7rem .8rem .7rem 1.1rem;
  display:flex; align-items:center; gap:12px; max-width:calc(100% - 32px); width:max-content;
  box-shadow:0 6px 0 rgba(0,0,0,.15); font-weight:700;
}
.toast[hidden]{display:none}
.toast button{border:0; background:var(--flor); color:#1C2B3A; border-radius:999px; padding:.35rem .9rem; font-weight:800}

@media (prefers-reduced-motion: reduce){
  *, *::before, *::after{animation:none !important; transition:none !important}
  .flash.flipped .flash-inner{transform:none}
  .flash .face.back{transform:none; display:none}
  .flash.flipped .face.front{display:none}
  .flash.flipped .face.back{display:flex}
}

/* ---------- Seitenrahmen für claude.ai ---------- */
:root{box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px)}
body{padding-top:0}

textarea{font:inherit}
.row-in textarea, .intento{font-family:var(--font-body)}

/* ---------- Karten ---------- */
.card{background:var(--surface); border:2px solid var(--line); border-radius:var(--r-lg); padding:1rem 1.1rem; margin-top:1rem}
.card h2{font-size:1.2rem; margin-bottom:.4rem}
.card .btn-text{display:block; margin:.5rem auto 0}
.escena-mini{display:flex; gap:12px; align-items:center; margin:.3rem 0 .4rem}
.escena-mini b{font-family:var(--font-display); font-size:1.15rem}
.escena-mini p{margin:0}
.em{font-size:1.55rem; width:50px; height:50px; border-radius:16px; background:var(--bg); display:grid; place-items:center; flex-shrink:0}
.task{margin:.2rem 0 .9rem}
.sub{font-size:1.25rem; margin:1.8rem 0 .5rem}
.center{text-align:center}
.center-row{justify-content:center; margin-top:1.2rem}
.notice{background:var(--rosa-claro); border:2px solid var(--rosa); border-radius:var(--r-md); padding:.7rem .9rem; margin:1rem 0; font-size:.97rem}
.notice.soft{background:var(--surface); border-color:var(--line)}

/* ---------- Szenenwahl ---------- */
.escenas{display:grid; gap:10px}
.escena{display:flex; gap:12px; align-items:center; text-align:left; border:2px solid var(--line); background:var(--surface); border-radius:var(--r-lg); padding:.65rem .85rem; box-shadow:0 3px 0 var(--line); color:var(--ink)}
.escena:active{transform:translateY(2px); box-shadow:0 1px 0 var(--line)}
.escena[disabled]{opacity:.5}
.escena .t{display:block; font-family:var(--font-display); font-weight:700; font-size:1.12rem; line-height:1.15}
.escena .s{display:block; color:var(--ink-2); font-size:.88rem}
.hist{width:100%; border:0; background:none; text-align:left; color:var(--ink)}
.hist .em{width:42px; height:42px; font-size:1.25rem}

/* ---------- Gespräch ---------- */
.chat-head{display:flex; align-items:center; justify-content:space-between; gap:8px; margin:.1rem 0 .5rem}
.chat-title{display:flex; flex-direction:column; align-items:center; line-height:1.15; text-align:center}
.chat-title b{font-family:var(--font-display); font-size:1.15rem}
.chat-title .muted{font-size:.82rem}
.turns{font-size:.85rem; color:var(--ink-2); font-weight:700; min-width:3.2em; text-align:right}
.mision{background:var(--flor-claro); border:2px solid var(--flor); border-radius:var(--r-lg); padding:.55rem .9rem; margin-bottom:1rem}
.mision summary{font-family:var(--font-display); font-weight:700; cursor:pointer}
.mision p{margin:.3rem 0 0}
.mision .en{color:var(--ink-2); font-size:.9rem}
.bubbles{display:flex; flex-direction:column; gap:12px; padding-bottom:10px}
.msg{display:flex; gap:8px; align-items:flex-end; max-width:88%}
.msg.p{align-self:flex-start}
.msg.m{align-self:flex-end}
.avatar{width:34px; height:34px; border-radius:50%; display:grid; place-items:center; font-family:var(--font-display); font-weight:800; color:#fff; flex-shrink:0; font-size:1.05rem}
.bubble{border-radius:20px; padding:.6rem .9rem; font-size:1.06rem; line-height:1.42; overflow-wrap:anywhere}
.msg.p .bubble{background:var(--surface); border:2px solid var(--line); border-bottom-left-radius:6px}
.msg.m .bubble{background:var(--agua); color:var(--on-agua); border-bottom-right-radius:6px}
.say{display:inline-grid; place-items:center; width:30px; height:30px; margin-left:6px; vertical-align:middle; border-radius:50%; border:2px solid var(--line); background:var(--bg); color:var(--agua); padding:0}
.say .ic{width:12px; height:12px; margin-left:2px}
.say.inline{width:28px; height:28px}
.reveal{border:0; background:none; color:var(--ink-2); font-style:italic; padding:0; text-align:left}
.typing{display:inline-flex; gap:5px; padding:.3rem 0}
.typing i{width:8px; height:8px; border-radius:50%; background:var(--ink-2); animation:blink 1.2s infinite ease-in-out}
.typing i:nth-child(2){animation-delay:.2s} .typing i:nth-child(3){animation-delay:.4s}
@keyframes blink{0%,80%,100%{opacity:.25} 40%{opacity:1}}
.checking{text-align:center; margin:1.4rem 0}
.checking .ajolote{width:150px; margin:0 auto; display:block}
.checking p{font-weight:700; color:var(--ink-2)}
.composer{position:fixed; left:0; right:0; bottom:0; z-index:6; background:var(--surface); border-top:2px solid var(--line); padding:8px 12px calc(10px + env(safe-area-inset-bottom,0px))}
.composer[hidden]{display:none}
.composer-in{max-width:560px; margin:0 auto}
.helps{display:flex; gap:6px; overflow-x:auto; margin:0 -2px 8px; padding:0 2px; scrollbar-width:none}
.helps::-webkit-scrollbar{display:none}
.help{white-space:nowrap; border:2px solid var(--rosa); color:var(--rosa-2); background:var(--rosa-claro); border-radius:999px; padding:.18rem .7rem; font-weight:700; font-size:.86rem}
.row-in{display:flex; gap:8px; align-items:flex-end}
.row-in textarea{flex:1; resize:none; border:2px solid var(--line); border-radius:20px; padding:.6rem .9rem; background:var(--bg); color:var(--ink); font-size:1.05rem; line-height:1.35; max-height:120px; min-height:46px}
.send{width:48px; height:48px; border-radius:50%; border:0; background:var(--agua); color:var(--on-agua); display:grid; place-items:center; flex-shrink:0; box-shadow:0 3px 0 var(--agua-2)}
.send[disabled]{opacity:.45}
.send .ic{width:22px; height:22px}
.dicta{font-size:.78rem; color:var(--ink-2); margin:.4rem .2rem 0}
body.chatting .tabbar{display:none}
body.chatting .app{padding-bottom:calc(150px + env(safe-area-inset-bottom,0px))}

/* ---------- Korrekturen ---------- */
.corr-head{text-align:center}
.corr-head .ajolote{width:160px; margin:0 auto; display:block}
.corr{border-bottom:1.5px solid var(--line); padding:.8rem 0}
.corr p{margin:.15rem 0}
.corr .ctx{color:var(--ink-2)}
.corr ul{margin:.3rem 0 .4rem; padding-left:1.2rem}
.corr li{margin:.2rem 0}
.ok{font-weight:700; color:var(--agua-2)}
:root[data-theme="dark"] .ok{color:var(--agua)}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) .ok{color:var(--agua)} }
.wrong{text-decoration:line-through; text-decoration-color:var(--rosa-2); text-decoration-thickness:2px}
.tips{margin:.2rem 0 0; padding-left:1.2rem}
.tips li{margin:.35rem 0}

/* ---------- Frases ---------- */
.frase-card{background:var(--surface); border:2px solid var(--line); border-radius:var(--r-xl); box-shadow:0 6px 0 var(--line); padding:1.3rem 1.2rem; text-align:center}
.frase-card .frase-en{font-family:var(--font-display); font-weight:700; font-size:clamp(1.4rem, 6vw, 1.9rem); line-height:1.2; margin:.6rem 0 .3rem; color:var(--ink)}
.frase-ctx{color:var(--ink-2); font-size:.92rem; margin:.3rem 0 0}
.intento{width:100%; border:2px solid var(--line); border-radius:var(--r-lg); padding:.7rem .9rem; font-size:1.08rem; background:var(--surface); color:var(--ink); resize:vertical; margin-bottom:.8rem}
.mine{margin:.2rem 0 .5rem}
.answer{font-family:var(--font-display); font-weight:700; font-size:1.45rem; line-height:1.25; margin:.3rem 0 .6rem}
mark.miss{background:var(--flor-claro); color:var(--flor-2); border-radius:5px; padding:0 3px}
mark.acc{background:none; color:inherit; text-decoration:underline wavy var(--jaca); text-underline-offset:4px}
.origen{background:var(--surface); border:2px dashed var(--line); border-radius:var(--r-md); padding:.55rem .85rem; margin:.4rem 0 1rem}
.origen summary{font-weight:700; cursor:pointer}
.origen ul{margin:.3rem 0 0; padding-left:1.2rem}

</style>
</head>

function conjugate(inf){
  if(irregular[inf]) return irregular[inf];
  let stem, presEnd, pretEnd;
  if(inf.endsWith('ar')){ stem = inf.slice(0,-2); presEnd=['o','as','a','amos','áis','an']; pretEnd=['é','aste','ó','amos','asteis','aron']; }
  else if(inf.endsWith('er')){ stem = inf.slice(0,-2); presEnd=['o','es','e','emos','éis','en']; pretEnd=['í','iste','ió','imos','isteis','ieron']; }
  else if(inf.endsWith('ir')){ stem = inf.slice(0,-2); presEnd=['o','es','e','imos','ís','en']; pretEnd=['í','iste','ió','imos','isteis','ieron']; }
  else { return null; }
  const pres = presEnd.map(e => stem+e);
  const pret = pretEnd.map(e => stem+e);
  let note = null;
  if(inf.endsWith('car')){ pret[0] = stem.slice(0,-1)+'qué'; note = "Spelling changes c→qu before é in the yo preterite (keeps the hard 'k' sound)."; }
  else if(inf.endsWith('gar')){ pret[0] = stem+'u'+'é'; note = "Spelling changes g→gu before é in the yo preterite (keeps the hard 'g' sound)."; }
  else if(inf.endsWith('zar')){ pret[0] = stem.slice(0,-1)+'c'+'é'; note = "Spelling changes z→c before é in the yo preterite (Spanish avoids 'zé')."; }
  return { pres, pret, note };
}

function saveState(){ const snap = JSON.parse(JSON.stringify(ST)); saveChain = saveChain.then(() => store.set('state', snap)).catch(() => toast('No se pudo guardar. Revisa tu conexión.')); }
function rollDay(){ const t = todayStr(); if(ST.day.date !== t) ST.day = { date:t, convos:0, frases:0, newFrases:0 }; }
function currentStreak(){
  if(!ST.streak.last) return 0;
  const t = todayStr(), y = todayStr(Date.now() - DAY);
  return (ST.streak.last === t || ST.streak.last === y) ? ST.streak.count : 0;
}
function bumpStreak(){
  const t = todayStr(); if(ST.streak.last === t) return;
  const y = todayStr(Date.now() - DAY);
  ST.streak.count = ST.streak.last === y ? ST.streak.count + 1 : 1;
  ST.streak.last = t;
}

/* ================= Wiederholung eigener Sätze ================= */
// Tagesbasiert: ein Satz kommt frühestens am nächsten Tag wieder; die drei Stufen sind immer verschieden.
function scheduleFrase(s, g, now = Date.now()){
  const c = s ? { ...s } : { ivl:0, ease:2.5, reps:0, lapses:0 };
  const sod = startOfDay(now);
  c.reps = (c.reps || 0) + 1;
  if(g === 1){ c.lapses = (c.lapses || 0) + 1; c.ease = Math.max(1.3, c.ease - 0.2); c.ivl = 0; c.due = sod + DAY; return c; }
  if(c.ivl === 0) c.ivl = g === 2 ? 1 : g === 3 ? 2 : 4;
  else {
    const hard = Math.max(c.ivl + 1, Math.round(c.ivl * 1.2));
    const good = Math.max(hard + 1, Math.round(c.ivl * c.ease));
    const easy = Math.max(good + 1, Math.round(c.ivl * c.ease * 1.3));
    c.ivl = g === 2 ? hard : g === 3 ? good : easy;
  }
  if(g === 2) c.ease = Math.max(1.3, c.ease - 0.15);
  if(g === 4) c.ease += 0.15;
  c.due = sod + c.ivl * DAY;
  return c;
}
function fmtDays(d){
  if(d <= 0) return 'mañana';
  if(d === 1) return '1 día';
  if(d < 14) return `${d} días`;
  if(d < 60) return `${Math.round(d/7)} sem.`;
  return `${Math.round(d/30)} meses`;
}
function frasesToday(){
  rollDay();
  const now = Date.now();
  const due = FRASES.filter(f => f.srs && f.srs.due <= now);
  const fresh = FRASES.filter(f => !f.srs && (f.availableFrom || 0) <= now).sort((a, b) => a.createdAt - b.createdAt);
  const newLeft = Math.max(0, NEW_FRASES_PER_DAY - ST.day.newFrases);
  return [...shuffle(due), ...fresh.slice(0, newLeft)].slice(0, MAX_FRASES_PER_SESSION);
}
function suggestScene(){
  const day = Math.floor(startOfDay() / DAY);
  const min = Math.min(...SCENES.map(s => ST.sceneCount[s.id] || 0));
  const pool = SCENES.filter(s => (ST.sceneCount[s.id] || 0) === min);
  return pool[day % pool.length];
}

/* ================= Claude als Gesprächspartner ================= */
let sample = null, sampleBlocked = false;
const PERMANENT = ['not_granted','sampling_disabled','not_declared','capability_disabled','capability_removed'];
function errText(code){
  if(PERMANENT.includes(code)) return 'Para conversar, la app necesita permiso para usar Claude. Ábrela en claude.ai y permítelo.';
  switch(code){
    case 'rate_limited': return 'Llegaste al límite por ahora. Intenta un poco más tarde.';
    case 'session_expired': return 'Tu sesión terminó. Vuelve a iniciar sesión en claude.ai.';
    case 'refused': return 'Eso no lo puedo contestar. Dilo de otra forma.';
    case 'invalid_json': return 'No pude preparar las correcciones.';
    case 'prompt_too_large': return 'La conversación es demasiado larga.';
    default: return 'Hubo un problema de conexión.';
  }
}
function rulesFor(scene, level, wrap){
  return `Vamos a practicar una conversación en español. Tú haces el papel de ${scene.who}, ${scene.role}. Miro es un suizo que aprende español y está de visita en México.
Situación: ${scene.title}. Lo que Miro quiere lograr: ${scene.task}

Reglas para ti:
- Habla solo como ${scene.who}, en español de México, natural y amable. Trata a Miro de ${scene.reg}.
- ${LEVELS[level].rule}
- En cada respuesta, como máximo dos oraciones, y termina con una sola pregunta para que Miro tenga que contestar.
- No corrijas sus errores. Si algo no se entiende, reacciona como una persona real («¿Mande?», «Perdón, ¿cómo?») y pide que lo repita.
- Si Miro pide ayuda (¿Mande?, ¿Puede repetir?, Más despacio, ¿Qué significa…?, No entiendo), ayúdale de verdad: repite con palabras más simples o explica la palabra en español sencillo.
- Si escribe en otro idioma, contesta en español y anímalo con cariño a intentarlo en español.
- Escribe solo lo que dice ${scene.who}: sin comillas, sin su nombre delante, sin acotaciones y sin traducciones.
${wrap ? '- AHORA: esta es tu última respuesta. Despídete de forma natural y amable, sin hacer otra pregunta.'
       : '- Si todavía no hay conversación, empieza tú con un saludo y una primera pregunta.'}`;
}
function cleanReply(t, who){
  let s = String(t || '').trim();
  s = s.replace(new RegExp('^\\**\\s*' + who.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + '\\s*\\**\\s*:\\s*\\**\\s*', 'i'), '');
  s = s.replace(/^["“«]+|["”»]+$/g, '').trim();
  return s;
}
function correctionPrompt(c){
  const sc = sceneById(c.scene);
  const transcript = c.turns.map(t => `${t.r === 'p' ? sc.who : 'Miro'}: ${t.t}`).join('\n');
  return `Eres profesor de español (variante de México). Revisa SOLO las intervenciones de Miro en esta conversación de práctica con ${sc.who}.

Responde únicamente con un objeto JSON con esta forma:
{"items":[{"context":"lo que dijo ${sc.who} justo antes","his":"el texto exacto de Miro","meaning_en":"what Miro meant, in English","errors":[{"wrong":"fragmento incorrecto","right":"forma correcta","why":"short explanation in English"}],"correct":"la frase completa corregida"}],"tips":["short tip in English"],"praise_es":"una frase corta de ánimo en español sencillo"}

Reglas:
- Un elemento en "items" por cada intervención de Miro, en orden, aunque no tenga errores (entonces "errors": []).
- Un solo error por objeto en "errors". No inventes errores: lo que es correcto en México no es un error.
- Corrige gramática, vocabulario, preposiciones, género, conjugación, ortografía y acentos.
- "correct" conserva lo que Miro quería decir, con los mínimos cambios, y suena natural en México.
- Si un error coincide con uno de sus patrones conocidos, dilo en "why".
- "tips": dos o tres consejos sobre los patrones más importantes de hoy.
Patrones conocidos de Miro: ${PATTERNS.join('; ')}.

Conversación:
${transcript}`;
}
function validCorrections(r, c){
  if(!r || !Array.isArray(r.items)) return null;
  const mine = c.turns.filter(t => t.r === 'm');
  const items = r.items.filter(x => x && typeof x.his === 'string').map((x, i) => ({
    context: String(x.context || ''), his: String(x.his || mine[i]?.t || ''), meaning_en: String(x.meaning_en || ''),
    errors: Array.isArray(x.errors) ? x.errors.filter(e => e && e.wrong && e.right).map(e => ({ wrong:String(e.wrong), right:String(e.right), why:String(e.why || '') })) : [],
    correct: String(x.correct || x.his || ''),
  }));
  if(!items.length) return null;
  return { items, tips: Array.isArray(r.tips) ? r.tips.map(String).slice(0, 4) : [], praise: String(r.praise_es || '') };
}

let voices = [];

function pickVoice(){
  if(!voices.length) return null;
  if(ST.settings.voice){ const v = voices.find(v => v.name === ST.settings.voice); if(v) return v; }
  return voices.find(v => /paulina/i.test(v.name)) || voices.find(v => v.lang === 'es-MX')
      || voices.find(v => v.lang === 'es-US') || voices.find(v => /m[oó]nica/i.test(v.name)) || voices[0];

const canSpeak = () => 'speechSynthesis' in window;
function speak(text){
  if(!canSpeak() || !text) return;
  try{
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    const v = pickVoice(); if(v){ u.voice = v; u.lang = v.lang; } else u.lang = 'es-MX';
    u.rate = ST.settings.rate === 'lenta' ? 0.78 : 0.95;
    speechSynthesis.speak(u);
  }catch(e){}
}

let chat = null, chatCtl = null, viewingConvo = null;
const myTurns = () => chat ? chat.turns.filter(t => t.r === 'm').length : 0;
function saveDraftChat(){ try{ if(chat && !chat.result) localStorage.setItem('charla-activa', JSON.stringify({ scene:chat.sc.id, level:chat.level, turns:chat.turns.filter(t => t.t), ended:chat.ended })); else localStorage.removeItem('charla-activa'); }catch(e){} }
function restoreDraftChat(){
  try{
    const r = JSON.parse(localStorage.getItem('charla-activa') || 'null');
    if(r && r.turns && r.turns.length) chat = { sc:sceneById(r.scene), level:r.level || 'normal', turns:r.turns, ended:!!r.ended, busy:false, error:null, result:null };
  }catch(e){}
}
function startChat(id){
  if(sampleBlocked) return;
  chat = { sc:sceneById(id), level:ST.settings.level, turns:[], ended:false, busy:false, error:null, result:null, correcting:false };
  viewingConvo = null;
  show('charla');
  partnerTurn();
}
async function partnerTurn(){
  if(!sample){ chat.error = 'Esta app conversa con Claude solo dentro de claude.ai.'; renderCharla(); return; }
  const wrap = myTurns() >= TURNS_TARGET;
  const msgs = [{ role:'user', content: rulesFor(chat.sc, chat.level, wrap) }];
  for(const t of chat.turns) if(t.t) msgs.push({ role: t.r === 'p' ? 'assistant' : 'user', content: t.t });
  const bubble = { r:'p', t:'', pending:true };
  chat.turns.push(bubble); chat.busy = true; chat.error = null;
  renderCharla(true);
  chatCtl = new AbortController();
  try{
    const res = await sample(msgs, { cache:false, signal:chatCtl.signal, onText: ({ text }) => { bubble.t = cleanReply(text, chat.sc.who); updateLastBubble(); } });
    bubble.t = cleanReply(res.text, chat.sc.who);
    bubble.pending = false;
    if(wrap) chat.ended = true;
    if(ST.settings.autoread) speak(bubble.t);
  }catch(e){
    bubble.pending = false;
    if(!bubble.t) chat.turns.pop();
    if(e && e.code === 'cancelled'){ /* selbst abgebrochen */ }
    else{
      if(e && PERMANENT.includes(e.code)) sampleBlocked = true;
      chat.error = errText(e && e.code); chat.errSrc = 'partner';
      chat.retry = !(e && (PERMANENT.includes(e.code) || e.code === 'rate_limited'));
    }
  }finally{
    chat.busy = false; saveDraftChat(); renderCharla(true);
  }
}
function sendMine(){
  const ta = $('#msg'); if(!ta || !chat || chat.busy || chat.ended) return;
  const t = ta.value.trim(); if(!t) return;
  chat.turns.push({ r:'m', t });
  ta.value = '';
  saveDraftChat();
  partnerTurn();
}
async function finishChat(){
  if(!chat || chat.correcting) return;
  if(chatCtl) chatCtl.abort();
  if(!myTurns()){ chat = null; saveDraftChat(); renderCharla(); return; }
  chat.correcting = true; chat.error = null; renderCharla();
  try{
    const r = await sample.json(correctionPrompt({ scene:chat.sc.id, turns:chat.turns.filter(t => t.t) }), { cache:false });
    const res = validCorrections(r, chat);
    if(!res) throw { code:'invalid_json' };
    chat.result = res;
    await saveConvo();
  }catch(e){
    chat.error = errText(e && e.code); chat.errSrc = 'correct'; chat.retry = !(e && PERMANENT.includes(e.code));
  }finally{
    chat.correcting = false; saveDraftChat(); renderCharla(); renderHoyIfVisible();
  }
}
async function saveConvo(){
  const now = Date.now(), id = 'c_' + now;
  const turns = chat.turns.filter(t => t.t).map(({ r, t }) => ({ r, t }));
  const doc = { kind:'convo', scene:chat.sc.id, level:chat.level, date:todayStr(), createdAt:now, turns,
                items:chat.result.items, tips:chat.result.tips, praise:chat.result.praise };
  const fr = [];
  chat.result.items.forEach((it, i) => {
    if(!it.errors.length || !it.meaning_en) return;
    fr.push({ id:`f_${now}_${i}`, kind:'frase', scene:chat.sc.id, en:it.meaning_en, context:it.context, his:it.his,
              errors:it.errors, correct:it.correct, createdAt:now + i, availableFrom:startOfDay(now) + DAY, srs:null });
  });
  rollDay(); ST.day.convos++; bumpStreak();
  ST.sceneCount[chat.sc.id] = (ST.sceneCount[chat.sc.id] || 0) + 1;
  chat.saved = fr.length;
  try{
    await store.set(id, doc);
    for(const f of fr){ const { id:fid, ...rest } = f; await store.set(fid, rest); }
    FRASES.push(...fr);
    if(CONVOS) CONVOS.unshift({ id, ...doc });
  }catch(e){ toast('No se pudo guardar la charla. Revisa tu conexión.'); }
  saveState();
}

let review = null;
function startReview(){
  const list = frasesToday();
  review = { queue:list.map(f => f.id), cur:null, checked:false, attempt:'', done:0 };
  nextFrase();
  show('frases');
}
function nextFrase(){ review.cur = review.queue.length ? FRASES.find(f => f.id === review.queue[0]) : null; review.checked = false; review.attempt = ''; }
function tokens(s){ return String(s).replace(/[¿?¡!.,;:«»"“”()…]/g, ' ').split(/\s+/).filter(Boolean); }
function diffHTML(attempt, correct){
  const a = tokens(attempt), b = tokens(correct);
  const A = a.map(norm), B = b.map(norm);
  const L = Array.from({ length:a.length + 1 }, () => new Array(b.length + 1).fill(0));
  for(let i = a.length - 1; i >= 0; i--) for(let j = b.length - 1; j >= 0; j--)
    L[i][j] = A[i] === B[j] ? L[i+1][j+1] + 1 : Math.max(L[i+1][j], L[i][j+1]);
  const okB = new Set(), okA = new Set(), accB = new Set();
  let i = 0, j = 0;
  while(i < a.length && j < b.length){
    if(A[i] === B[j]){ okA.add(i); okB.add(j); if(a[i].toLowerCase() !== b[j].toLowerCase()) accB.add(j); i++; j++; }
    else if(L[i+1][j] >= L[i][j+1]) i++; else j++;
  }
  const mine = a.map((w, k) => okA.has(k) ? esc(w) : `<span class="wrong">${esc(w)}</span>`).join(' ');
  const right = b.map((w, k) => !okB.has(k) ? `<mark class="miss">${esc(w)}</mark>` : accB.has(k) ? `<mark class="acc">${esc(w)}</mark>` : esc(w)).join(' ');
  const perfect = okB.size === b.length && okA.size === a.length && !accB.size;
  return { mine, right, perfect };
}

    v.innerHTML = `<header class="top"><h1 class="title">Mis frases</h1><span class="muted">${FRASES.length}</span></header>
      <p class="lede">Aquí vuelven las frases que corregimos en tus charlas. Las ves en inglés y las dices en español.</p>

  }
  if(!review.cur){
    v.innerHTML = `<div class="done">${ajoloteSVG('happy')}<h1>¡Listo!</h1><p>${review.done === 1 ? 'Repasaste 1 frase.' : `Repasaste ${review.done} frases.`}</p>

    return;
  }
  const f = review.cur, sc = sceneById(f.scene);
  const left = review.queue.length;
  let below;
  if(!review.checked){
    below = `<textarea id="intento" class="intento" rows="2" placeholder="Escríbelo o díctalo en español" autocapitalize="sentences">${esc(review.attempt)}</textarea>
      <div class="practice"><button class="btn-go" data-act="check">Comprobar</button><button class="btn-soft" data-act="reveal">No lo sé</button></div>`;
  } else {
    const d = review.attempt ? diffHTML(review.attempt, f.correct) : null;
    const prev = f.srs || null;
    below = `
      ${d ? `<p class="mine"><span class="muted">Tú ahora:</span> ${d.mine}</p>` : ''}
      <p class="answer">${d ? d.right : esc(f.correct)} ${canSpeak() ? `<button class="say inline" data-say="${esc(f.correct)}" aria-label="Escuchar">${icon('i-play')}</button>` : ''}</p>
      ${d && d.perfect ? '<p class="ok">¡Perfecto! ✅</p>' : ''}
      <details class="origen"><summary>En la charla dijiste</summary><p><i>${esc(f.his)}</i></p>
        <ul>${f.errors.map(e => `<li><i class="wrong">${esc(e.wrong)}</i> → <b>${esc(e.right)}</b>${e.why ? ` — ${esc(nice(e.why))}` : ''}</li>`).join('')}</ul></details>
      <div class="grades">${[[1,'Otra vez'],[2,'Difícil'],[3,'Bien'],[4,'Fácil']].map(([g, l]) =>
        `<button class="grade g${g}" data-grade="${g}"><span>${l}</span><small>${fmtDays(scheduleFrase(prev, g).ivl)}</small></button>`).join('')}</div>`;
  }
  v.innerHTML = `
    <div class="sess-top"><button class="btn-text" data-act="end-review">Terminar</button><span class="turns">${plural(left, 'frase', 'frases')}</span></div>
    <section class="frase-card">
      <span class="flash-cat">${sc.em} ${esc(sc.title)}</span>
      <p class="frase-en">${esc(nice(f.en))}</p>
      ${f.context ? `<p class="frase-ctx">Antes: <i>${esc(f.context)}</i></p>` : ''}
    </section>
    <div class="below">${below}</div>`;
  if(!review.checked){ const ta = $('#intento'); if(ta && !matchMedia('(pointer:coarse)').matches) ta.focus(); }
}
function gradeFrase(g){
  const f = review.cur; if(!f) return;
  rollDay();
  const wasNew = !f.srs;
  f.srs = scheduleFrase(f.srs, g);
  ST.day.frases++; if(wasNew) ST.day.newFrases++;
  bumpStreak();
  store.update(f.id, { srs:f.srs }).catch(() => toast('No se pudo guardar. Revisa tu conexión.'));
  saveState();
  review.queue.shift();
  if(g === 1) review.queue.push(f.id);   // in dieser Runde noch einmal
  review.done++;
  nextFrase(); renderFrases();
}

/* ================= Ansicht: Verbos ================= */
const PERSONS = ['yo','tú','él, ella, usted','nosotros','vosotros','ellos, ustedes'];
const REFL = ['me','te','se','nos','os','se'];
function regularForms(inf){
  const end = inf.slice(-2), stem = inf.slice(0, -2);
  const E = { ar:[['o','as','a','amos','áis','an'],['é','aste','ó','amos','asteis','aron']],
              er:[['o','es','e','emos','éis','en'],['í','iste','ió','imos','isteis','ieron']],
              ir:[['o','es','e','imos','ís','en'],['í','iste','ió','imos','isteis','ieron']] };
  if(!E[end]) return null;
  return { stem, pres:E[end][0].map(e => stem + e), pret:E[end][1].map(e => stem + e) };
}
function verbInfo(inf){
  const reflexive = /se$/.test(inf) && !/\s/.test(inf);
  const base = reflexive ? inf.slice(0, -2) : inf;
  const conj = conjugate(base), reg = regularForms(base);
  if(!conj || !reg) return null;
  const PEOPLE = [0,1,2,3,5];
  const diff = (a, b) => PEOPLE.filter(i => norm(a[i]) !== norm(b[i]));
  const inStem = (a, b, i) => { const x = norm(a[i]), y = norm(b[i]); let p = 0; while(p < x.length && p < y.length && x[p] === y[p]) p++; return p < reg.stem.length; };
  const pd = diff(conj.pres, reg.pres), td = diff(conj.pret, reg.pret);
  let presType = null, pretType = null;
  if(pd.length){ const s = pd.join(','); presType = s === '0' ? 'yo' : (s === '0,1,2,5' && [1,2,5].every(i => inStem(conj.pres, reg.pres, i))) ? 'bota' : 'irregular'; }
  if(td.length){ const s = td.join(','); pretType = (/e$/.test(conj.pret[0]) && /o$/.test(conj.pret[2])) ? 'fuerte' : s === '0' ? 'ortografia' : s === '2,5' ? 'tercera' : 'irregular'; }
  return { inf, base, reflexive, conj, reg, presType, pretType };
}
const PRES_TAG = { bota:['Verbo bota','tag-bota'], yo:['Yo irregular','tag-yo'], irregular:['Irregular','tag-irr'] };
const PRET_TAG = { fuerte:['Pretérito fuerte','tag-fuerte'], tercera:['Cambia en él y ellos','tag-bota'], ortografia:['Ortografía en yo','tag-yo'], irregular:['Pretérito irregular','tag-irr'] };
const EXPLAIN = {
  bota:'La raíz cambia en todas las formas menos nosotros y vosotros. Mira la tabla: las casillas que cambian dibujan una bota.',
  yo:'Solo la forma de yo es irregular. Las demás siguen la regla.',
  fuerte:'Pretérito fuerte: raíz propia y siempre las mismas terminaciones, <span class="nw">-e, -iste, -o, -imos, -ieron</span>. Sin acentos.',
  tercera:'La raíz cambia solo en él / ella y en ellos.',
  ortografia:'Solo cambia la escritura en yo, para conservar el sonido.',
  irregular:'Estas formas hay que aprenderlas de memoria.'
};
const _vinfo = new Map();
function info(inf){ if(!_vinfo.has(inf)) _vinfo.set(inf, verbInfo(inf)); return _vinfo.get(inf); }
let _verbs = null;
function verbList(){
  if(_verbs) return _verbs;
  const seen = new Set(); _verbs = [];
  (data['Verbs (infinitive)'] || []).forEach(([es, en]) => { if(!seen.has(es) && info(es)){ seen.add(es); _verbs.push({ inf:es, en }); } });
  (data['Reflexive verbs'] || []).forEach(([es, en]) => { if(/se$/.test(es) && !/\s/.test(es) && !seen.has(es) && info(es)){ seen.add(es); _verbs.push({ inf:es, en:en.split(' — ')[0] }); } });
  return _verbs;
}
let _forms = null;
function formIndex(){
  if(_forms) return _forms;
  _forms = new Map();
  const add = (form, hit) => { const k = norm(form); if(!_forms.has(k)) _forms.set(k, []); _forms.get(k).push(hit); };
  for(const v of verbList()){
    const i = info(v.inf);
    for(const tense of ['pres','pret']) i.conj[tense].forEach((f, p) => {
      add(f, { inf:v.inf, tense, p, form:i.reflexive ? `${REFL[p]} ${f}` : f });
      if(i.reflexive) add(`${REFL[p]} ${f}`, { inf:v.inf, tense, p, form:`${REFL[p]} ${f}` });
    });
  }
  return _forms;
}
function markDiff(actual, regular){
  if(!regular || actual === regular) return esc(actual);
  let p = 0; while(p < actual.length && p < regular.length && actual[p] === regular[p]) p++;
  let s = 0; while(s < actual.length - p && s < regular.length - p && actual[actual.length-1-s] === regular[regular.length-1-s]) s++;
  let mid = actual.slice(p, actual.length - s);
  const regMid = regular.slice(p, regular.length - s);
  if(regMid === '' && mid.length === 1){
    if(/[iu]/.test(mid) && s > 0 && /[eo]/.test(actual[actual.length - s])){ s -= 1; mid = actual.slice(p, actual.length - s); }
    else if(mid === 'e' && p > 0 && actual[p - 1] === 'u'){ p -= 1; mid = actual.slice(p, actual.length - s); }
  }
  if(!mid) return esc(actual);
  return esc(actual.slice(0, p)) + `<mark class="chg">${esc(mid)}</mark>` + esc(actual.slice(actual.length - s));
}
function tableHTML(i, tense){
  const forms = i.conj[tense], reg = i.reg[tense];
  const strong = tense === 'pret' && i.pretType === 'fuerte' ? forms[0].slice(0, -1) : null;
  return '<div class="conj">' + [0,3,1,4,2,5].map(p => {
    const f = forms[p], r = reg[p];
    const changed = norm(f) !== norm(r);
    let html = strong && f.startsWith(strong) ? `<mark class="chg">${esc(strong)}</mark><mark class="end">${esc(f.slice(strong.length))}</mark>` : markDiff(f, r);
    const full = i.reflexive ? `${REFL[p]} ${f}` : f;
    if(i.reflexive) html = `<span class="refl">${REFL[p]}</span> ${html}`;
    return `<button class="cell${changed ? ' chg' : ''}${p === 4 ? ' vos' : ''}" data-say="${esc(full)}"><small>${PERSONS[p]}${p === 4 ? ' (España)' : ''}</small><span class="f">${html}</span></button>`;
  }).join('') + '</div>';
}
function tagsHTML(i){
  const t = [i.presType && PRES_TAG[i.presType], i.pretType && PRET_TAG[i.pretType]].filter(Boolean);
  return t.length ? `<div class="tags">${t.map(([l, c]) => `<span class="tag ${c}">${l}</span>`).join('')}</div>` : '';
}
let verbQuery = '', verbsBuilt = false;
function renderVerbos(){
  const v = $('#view-verbos');
  if(!verbsBuilt){
    v.innerHTML = `<header class="top"><h1 class="title">Verbos</h1><span class="muted">${verbList().length}</span></header>
      <input class="search" type="search" data-input="verbs" placeholder="Busca un verbo o una forma: pienso, tuve…" aria-label="Buscar verbo">
      <div data-list="lookup"></div><div data-list="verbs"></div>`;
    verbsBuilt = true;
  }
  renderVerbList();
}
function renderVerbList(){
  const q = norm(verbQuery), lk = $('[data-list="lookup"]'), box = $('[data-list="verbs"]');
  if(!box) return;
  const hits = q ? (formIndex().get(q) || []) : [];
  const uniq = [], seen = new Set();
  for(const h of hits){ const k = h.inf + h.tense + h.p; if(!seen.has(k)){ seen.add(k); uniq.push(h); } }
  lk.innerHTML = uniq.slice(0, 4).map(h => `<button class="hit" data-verb="${esc(h.inf)}">«<b>${esc(h.form)}</b>» es ${esc(h.inf)}, ${h.tense === 'pres' ? 'presente' : 'pretérito'} de ${PERSONS[h.p].split(',')[0]}.</button>`).join('');
  const list = verbList().filter(x => !q || norm(x.inf).includes(q) || norm(x.en).includes(q));
  if(!list.length && !uniq.length){ box.innerHTML = `<p class="empty">No encuentro «${esc(verbQuery)}». Prueba con el infinitivo o en inglés.</p>`; return; }
  box.innerHTML = list.map(x => `<div class="row"><button class="w" data-verb="${esc(x.inf)}"><span class="w-es">${esc(x.inf)}</span><span class="w-en">${esc(nice(x.en))}</span>${tagsHTML(info(x.inf))}</button>
    ${canSpeak() ? `<button class="play" data-say="${esc(x.inf)}" aria-label="Escuchar ${esc(x.inf)}">${icon('i-play')}</button>` : ''}</div>`).join('');
}
function openVerb(inf){
  const i = info(inf); if(!i) return;
  const entry = verbList().find(x => x.inf === inf);
  const ex = (type, cls) => type ? `<p class="explain ${cls}">${icon(type === 'bota' ? 'i-bota' : 'i-estrella')}<span>${EXPLAIN[type]}</span></p>` : '';
  const d = $('#sheet-verb');
  d.innerHTML = `<div class="sheet-in"><div class="grab"></div>
    <div class="sheet-head"><div><h2 class="verb-title">${esc(inf)}</h2><p class="muted" style="margin:.1rem 0 0">${esc(nice(entry ? entry.en : ''))}</p>${tagsHTML(i)}</div>
    ${canSpeak() ? `<button class="play" data-say="${esc(inf)}" aria-label="Escuchar ${esc(inf)}">${icon('i-play')}</button>` : ''}</div>
    <h3>Presente</h3>${tableHTML(i, 'pres')}${ex(i.presType, i.presType === 'bota' ? '' : 'fuerte')}
    <h3>Pretérito</h3>${tableHTML(i, 'pret')}${ex(i.pretType, i.pretType === 'tercera' ? '' : 'fuerte')}
    ${i.conj.note ? `<p class="note">${esc(nice(i.conj.note))}</p>` : ''}
    <button class="btn-soft close" data-close>Cerrar</button></div>`;
  if(!d.open) d.showModal();
  d.scrollTop = 0;
}

let currentView = 'hoy';
const scrollPos = {};
const RENDER = { hoy:renderHoy, charla:renderCharla, frases:renderFrases, verbos:renderVerbos };
function show(view){
  scrollPos[currentView] = window.scrollY;
  currentView = view;
  $$('.view').forEach(x => x.classList.toggle('active', x.id === 'view-' + view));
  $$('.tab').forEach(t => t.setAttribute('aria-current', t.dataset.view === view ? 'page' : 'false'));
  $('#composer').hidden = true;
  RENDER[view]();
  if(view !== 'charla' || !chat || chat.result) window.scrollTo(0, scrollPos[view] || 0);
  document.body.classList.toggle('chatting', !!(view === 'charla' && chat && !chat.result));
}
function renderHoyIfVisible(){ if(currentView === 'hoy') renderHoy(); }
let toastTimer = null;
function toast(msg){
  const t = $('#toast'); t.textContent = msg; t.hidden = false;
  clearTimeout(toastTimer); toastTimer = setTimeout(() => { t.hidden = true; }, 4000);
}

/* ================= Ereignisse ================= */
document.addEventListener('click', e => {
  const say = e.target.closest('[data-say]'); if(say){ speak(say.dataset.say); return; }
  const tab = e.target.closest('.tab'); if(tab){ show(tab.dataset.view); return; }
  const tb = e.target.closest('[data-tab]'); if(tb){ show(tb.dataset.tab); return; }
  const sc = e.target.closest('[data-scene]'); if(sc){ startChat(sc.dataset.scene); return; }
  const verb = e.target.closest('[data-verb]'); if(verb){ openVerb(verb.dataset.verb); return; }
  const close = e.target.closest('[data-close]'); if(close){ close.closest('dialog').close(); return; }
  const help = e.target.closest('[data-help]');
  if(help){ const ta = $('#msg'); const h = help.dataset.help; ta.value = (ta.value && !ta.value.endsWith(' ') ? ta.value + ' ' : ta.value) + h; ta.focus(); return; }
  const rev = e.target.closest('[data-reveal]'); if(rev){ const t = chat.turns[Number(rev.dataset.reveal)]; if(t){ t.shown = true; renderCharla(false); } return; }
  const cv = e.target.closest('[data-convo]'); if(cv){ viewingConvo = (CONVOS || []).find(c => c.id === cv.dataset.convo) || null; renderCharla(); window.scrollTo(0, 0); return; }
  const g = e.target.closest('[data-grade]'); if(g){ gradeFrase(Number(g.dataset.grade)); return; }
  const seg = e.target.closest('.seg button');
  if(seg){
    const key = seg.parentElement.dataset.setting; let val = seg.dataset.value;
    if(key === 'autoread' || key === 'hide') val = val === 'true';
    ST.settings[key] = val; saveState(); syncSettings();
    if(key === 'theme') applyTheme();
    return;
  }
  const act = e.target.closest('[data-act]'); if(!act) return;
  switch(act.dataset.act){
    case 'settings': syncSettings(); $('#sheet-settings').showModal(); break;
    case 'resume': show('charla'); break;
    case 'finish': finishChat(); break;
    case 'retry': if(chat){ chat.error = null; partnerTurn(); } break;
    case 'home': chat = null; saveDraftChat(); show('hoy'); break;
    case 'new-chat': chat = null; saveDraftChat(); show('charla'); break;
    case 'close-convo': viewingConvo = null; renderCharla(); break;
    case 'frases': startReview(); break;
    case 'check': review.attempt = ($('#intento')?.value || '').trim(); review.checked = true; renderFrases(); break;
    case 'reveal': review.attempt = ''; review.checked = true; renderFrases(); break;
    case 'end-review': review = null; renderFrases(); break;
  }
});
$('#send').addEventListener('click', sendMine);
$('#msg').addEventListener('keydown', e => { if(e.key === 'Enter' && !e.shiftKey && !matchMedia('(pointer:coarse)').matches){ e.preventDefault(); sendMine(); } });
$('#msg').addEventListener('input', e => { const t = e.target; t.style.height = 'auto'; t.style.height = Math.min(t.scrollHeight, 120) + 'px'; });
document.addEventListener('input', e => { if(e.target.dataset.input === 'verbs'){ verbQuery = e.target.value; renderVerbList(); } });
document.addEventListener('change', e => { if(e.target.id === 'voz'){ ST.settings.voice = e.target.value; saveState(); speak('Hola, ¿cómo estás?'); } });
$$('dialog.sheet').forEach(d => d.addEventListener('click', e => { if(e.target === d) d.close(); }));
document.addEventListener('visibilitychange', () => { if(document.visibilityState === 'visible'){ rollDay(); renderHoyIfVisible(); } });

/* ================= Start ================= */
applyTheme();
restoreDraftChat();
renderHoy();
if(canSpeak()){ loadVoices(); speechSynthesis.onvoiceschanged = loadVoices; }
(async () => {
  try{ if(window.claude && typeof window.claude.use === 'function') sample = await window.claude.use('sample'); }catch(e){ sample = null; }
  if(!sample) sampleBlocked = true;
  await loadAll();
  applyTheme();
  renderHoy();
  if(currentView !== 'hoy') RENDER[currentView]();
})();

</script>
